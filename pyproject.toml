[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oncogene-explorer"
version = "0.1.0"
description = "Leakage-safe analysis of breast tumor vs. paired adjacent-normal gene expression (GEO GSE109169)."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26,<2.3",
  "pandas>=2.1,<3",
  "scipy>=1.11,<1.16",
  "scikit-learn>=1.6,<1.7",
  "statsmodels>=0.14,<0.15",
  "matplotlib>=3.8,<4",
  "seaborn>=0.13,<0.14",
  "plotly>=5.20,<7",
  "streamlit>=1.35,<2",
  "joblib>=1.3",
  "pyyaml>=6",
  "requests>=2.31",
  "tabulate>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "nbformat>=5.9", "nbconvert>=7", "ipykernel>=6"]

[project.scripts]
oncogene = "oncogene.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
markers = ["data: tests that require the downloaded GSE109169 data (skipped if absent)"]
